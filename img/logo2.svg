<svg xmlns="http://www.w3.org/2000/svg" viewBox="100 80 312 340" width="100%" height="100%">
  <!-- параметры: центр 256,256, радиус расположения узлов 140 -->
  <!-- шесть узлов (круги) и внешний шестигранник -->
  <defs>
    <style>
      .stroke { stroke:#fff; stroke-width:24; stroke-linecap:round; stroke-linejoin:round; fill:none; }
      .dot { fill:#fff; }
    </style>
  </defs>

  <!-- внешний шестиугольник (грани) -->
  <path class="stroke" d="M256 116 L377.24 186 L377.24 326 L256 396 L134.76 326 L134.76 186 Z"/>

  <!-- внутренние диагонали (крест из трёх линий) -->
  <line class="stroke" x1="256" y1="116" x2="256" y2="396"/>
  <line class="stroke" x1="377.24" y1="186" x2="134.76" y2="326"/>
  <line class="stroke" x1="377.24" y1="326" x2="134.76" y2="186"/>

  <!-- окружности-узлы -->
  <circle class="dot" cx="256" cy="116" r="22"/>
  <circle class="dot" cx="377.24" cy="186" r="22"/>
  <circle class="dot" cx="377.24" cy="326" r="22"/>
  <!-- <circle class="dot" cx="256" cy="396" r="22"/> -->
  <circle class="dot" cx="134.76" cy="326" r="22"/>
  <circle class="dot" cx="134.76" cy="186" r="22"/>
</svg>
